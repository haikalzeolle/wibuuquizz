<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursed Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="bg"><i class="kanji">呪</i><i class="slash s1"></i><i class="slash s2"></i></div>
<header><h1>CURSED QUIZ</h1><p class="jp">領域展開</p></header>
<main>
  <section id="lobby" class="screen on">
    <div class="panel cust">
      <h2>Create your sorcerer</h2>
      <div id="preview"></div>
      <input id="name" maxlength="14" placeholder="Your name" autocomplete="off">
      <h3>Base character</h3><div id="chars" class="row"></div>
      <h3>Hair style</h3><div id="styles" class="row"></div>
      <h3>Accessory</h3><div id="accs" class="row"></div>
      <div class="row colors">
        <label>Hair <input type="color" id="hair"></label>
        <label>Uniform <input type="color" id="outfit"></label>
        <label>Cursed energy <input type="color" id="aura"></label>
      </div>
      <button id="join" class="btn">Enter the waiting room</button>
      <p id="err" class="err"></p>
    </div>
    <div class="panel queue">
      <h2>Waiting room <span id="count">0/30</span></h2>
      <div id="players"></div>
      <button id="start" class="btn red" hidden>Start battle</button>
      <p id="wait" class="hint">Join, then wait for the host to start the battle.</p>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="hud"><span id="qno"></span><span id="ans"></span><b id="secs">30</b></div>
    <div class="bar"><i id="barfill"></i></div>
    <h2 id="qtext" class="panel qbox"></h2>
    <div id="opts"></div>
    <p id="feedback" class="hint"></p>
    <div id="mini"></div>
  </section>

  <section id="final" class="screen">
    <h2 class="big">Final ranking</h2>
    <div id="podium"></div>
    <div id="rank"></div>
    <button id="again" class="btn" hidden>Play again</button>
  </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/avatar.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
